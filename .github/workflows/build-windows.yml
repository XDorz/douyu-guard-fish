name: Build Windows assistant

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pyinstaller

      - name: Build one-file executable
        shell: pwsh
        run: |
          if (Test-Path "保卫鱼娘自动挂机") { Remove-Item -Recurse -Force "保卫鱼娘自动挂机" }
          if (Test-Path "_build_tmp") { Remove-Item -Recurse -Force "_build_tmp" }
          python -m PyInstaller --noconfirm --distpath "保卫鱼娘自动挂机" --workpath "_build_tmp" yu_gui.spec

      - name: Package artifact
        shell: pwsh
        run: |
          $zip = "guard-fish-assistant-${{ github.run_number }}-win64.zip"
          Compress-Archive -Path "保卫鱼娘自动挂机\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: guard-fish-assistant-${{ github.run_number }}-win64
          path: guard-fish-assistant-${{ github.run_number }}-win64.zip
          if-no-files-found: error
